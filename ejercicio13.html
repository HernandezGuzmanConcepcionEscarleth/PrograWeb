<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="Stylesheet" href="css/ejercicio13.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="Stylesheet">
</head>

<body>

    <div class="contenedor-formulario">

        <h1>Calculadora</h1>
        <p class="subtitulo">¿Puede votar o no?</p>

        <form class="formulario">

            <div class="grupo-formulario">
                <label for="edad">Edad</label>
                <input type="number" id="edad" placeholder="Ej: 18 años">
            </div>

            <div class="grupo-doble">

                <div class="grupo-formulario">
                    <label for="puede-votar">¿Puede o no?</label>
                    <input type="text" id="puede-votar" placeholder="Resultado" readonly>
                </div>

                <button type="button" onclick="calcular()">Verificar</button>

            </div>

        </form>

    </div>

    <script src="js/ejercicio13.js"></script>

</body>
</html>
