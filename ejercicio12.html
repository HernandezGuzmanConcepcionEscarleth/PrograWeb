<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversión de Pesos</title>

    <link rel="Stylesheet" href="css/ejercicio12.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="Stylesheet">
</head>

<body>

    <div class="contenedor-formulario">

        <h1>Conversión de Pesos</h1>
        <p class="subtitulo">Pesos Mexicanos a Dólares</p>

        <form class="formulario">

            <div class="grupo-formulario">
                <label for="pesos">Pesos Mexicanos</label>
                <input type="number" id="pesos" placeholder="Ej: 100 MXN">
            </div>

            <div class="grupo-doble">

                <div class="grupo-formulario">
                    <label for="dolares">Dólares</label>
                    <input type="text" id="dolares" placeholder="Resultado" readonly>
                </div>

                <button type="button" onclick="calcular()">Convertir</button>

            </div>

        </form>

    </div>

    <script src="js/ejercicio12.js"></script>

</body>
</html>
