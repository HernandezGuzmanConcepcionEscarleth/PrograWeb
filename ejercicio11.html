<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversión de Kilómetros</title>

    <link rel="Stylesheet" href="css/Ejercicio11.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="Stylesheet">
</head>

<body>

    <div class="contenedor-formulario">

        <h1>Conversión de Kilómetros</h1>
        <p class="subtitulo">Kilómetros a Millas</p>

        <form class="formulario">

            <div class="grupo-formulario">
                <label for="kilometros">Kilómetros</label>
                <input type="number" id="kilometros" placeholder="Ej: 10 km">
            </div>

            <div class="grupo-doble">

                <div class="grupo-formulario">
                    <label for="millas">Millas</label>
                    <input type="text" id="millas" placeholder="Resultado" readonly>
                </div>

                <button type="button" onclick="calcular()">Convertir</button>

            </div>

        </form>

    </div>

    <script src="js/Ejercicio11.js"></script>

</body>
</html>
