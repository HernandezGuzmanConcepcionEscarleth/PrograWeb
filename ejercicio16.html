<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="CSS/ejercicio16.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="contenedor-calculadora">

        <h1>Calculadora</h1>

        <div class="formulario-calculadora">

            <label>Número 1:</label>
            <input type="text" id="numero1" placeholder="Ingresa el primer número">

            <label>Número 2:</label>
            <input type="text" id="numero2" placeholder="Ingresa el segundo número">

            <div class="botones">

                <button onclick="calcularOperacion('suma')">
                    Sumar
                </button>

                <button onclick="calcularOperacion('resta')">
                    Restar
                </button>

                <button onclick="calcularOperacion('multiplicacion')">
                    Multiplicar
                </button>

                <button onclick="calcularOperacion('division')">
                    Dividir
                </button>

            </div>

            <label>Resultado:</label>
            <input type="text" id="resultado" readonly>

        </div>

    </div>

    <script src="JS/ejercicio16.js"></script>

</body>

</html>
